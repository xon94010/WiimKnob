; WiimKnob - WiiM remote control firmware for the Waveshare ESP32-S3-Knob-Touch-LCD-1.8
;
; Board facts (verified against the schematic + factory firmware, see README.md):
;   ESP32-S3R8, 16MB quad flash, 8MB octal PSRAM, 360x360 round QSPI panel (ST77916),
;   CST816D capacitive touch, single-pulse-per-direction knob encoder.

[env:esp32-s3-knob]
; The official PlatformIO "espressif32" platform is still stuck on arduino-esp32 core 2.0.x
; (IDF4), which lacks esp32-hal-periman.h -- required by any current version of the display
; library below. pioarduino's platform-espressif32 fork tracks arduino-esp32 core 3.x (IDF5)
; and is the standard replacement; see https://github.com/pioarduino/platform-espressif32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM straps for the ESP32-S3R8 module on this board ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi ; quad flash + octal PSRAM
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; LVGL's own relative-path lookup for lv_conf.h doesn't reach PlatformIO's project include
    ; dir from inside .pio/libdeps/.../lvgl/src/core/, and PlatformIO doesn't add the project's
    ; include/ dir to library dependencies' search path (only to project src/). This makes LVGL
    ; do a plain #include "lv_conf.h", and adds include/ explicitly so every compiled object
    ; (project and library alike) can resolve it.
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.8
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.8.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
